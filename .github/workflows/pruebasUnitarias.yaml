name: Pruebas Unitarias
on:
  push:
    branches: [develop, main] 
  pull_request:
    branches: [develop, main]

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Intala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.1.0

      - name: clona el repositorio
        uses: actions/checkout@v3

      - name: Instala dependencias
        run: npm install

      - name: Ejecuta tests unitarios
        run: npm run test

   

