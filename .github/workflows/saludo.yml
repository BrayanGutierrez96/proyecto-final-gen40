name: Saludo

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

  # SCHEDULE:
  #   cron: "* * 5 * *"
  # Sitaxis del cron: 'MINUTO HORA DIA_MES MES DIA_SEMANA'

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instala node en la version 22.1.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.1.0"

      - name: Mostrando saludo
        run: echo "Hola te saludo desde la consola del servidor de github"